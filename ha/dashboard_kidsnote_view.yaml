                - border: none
                - box-shadow: none
                - border-radius: 14px
                - aspect-ratio: 1 / 1
                - background-color: '#E9E8E5'
                - background-size: cover
                - background-position: center
                - background-image: '[[[ return entity && entity.attributes.entity_picture ? `url("${entity.attributes.entity_picture}")`
                    : ''none''; ]]]'
                - position: relative
                custom_fields:
                  more:
                  - position: absolute
                  - inset: '0'
              custom_fields:
                more:
                  card:
                    type: custom:button-card
                    entity: sensor.kidsnote_page_photo_count
                    show_name: false
                    show_icon: false
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: script.turn_on
                      target:
                        entity_id: script.kidsnote_photo_next
                    hold_action:
                      action: none
                    custom_fields:
                      v: |
                        [[[ return `+${entity ? entity.attributes.remaining : 0}`; ]]]
                    styles:
                      card:
                      - width: 100%
                      - height: 100%
                      - padding: '0'
                      - border: none
                      - box-shadow: none
                      - border-radius: 14px
                      - background: rgba(0,0,0,.45)
                      - cursor: pointer
                      - display: '[[[ return entity && Number(entity.attributes.remaining) > 0 ? ''flex'' : ''none''; ]]]'
                      grid:
                      - grid-template-areas: '"v"'
                      - width: 100%
                      - height: 100%
                      custom_fields:
                        v:
                        - color: '#fff'
                        - font-size: 20px
                        - font-weight: '700'
                        - align-self: center
                        - justify-self: center
        - type: grid
          columns: 1
          square: false
          cards:
          - type: custom:button-card
            entity: sensor.kidsnote_summary
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: none
            custom_fields:
              c: |
                [[[
                  const esc = (t) => String(t || '').replace(/[&<>"]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
                  const list = (entity && entity.attributes.notices) || [];
                  const rows = list.map((n, i) => `
                    <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0;${i ? 'border-top:1px solid #EEECE8;' : ''}">
                      <div style="flex:none;width:44px;font-size:12.5px;color:#8C8D90;padding-top:2px;">${esc(n.date_label)}</div>
                      <div style="min-width:0;flex:1;">
                        <div style="font-size:14.5px;font-weight:600;color:#252525;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${n.is_new ? '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#E9806E;margin:0 6px 2px 0;"></span>' : ''}${esc(n.title)}</div>
                        <div style="font-size:12.5px;color:#8C8D90;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(n.snippet)}</div>
                      </div></div>`).join('');
                  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
                    <div style="display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:#252525;">
                      <ha-icon icon="mdi:bullhorn-outline" style="--mdc-icon-size:18px;color:#E9806E"></ha-icon>최근 공지</div>
                    <div style="font-size:12.5px;color:#8C8D90;"></div></div>
                    ${rows || '<div style="font-size:14px;color:#8C8D90;padding-top:8px;">공지가 없어요.</div>'}`;
                ]]]
            styles:
              card:
              - background: '#FFFFFF'
              - box-shadow: none
              - border: none
              - border-radius: 20px
              - padding: 16px 18px
              - height: auto
              - cursor: default
              - padding: 14px 18px 6px
              grid:
              - grid-template-areas: '"c"'
              - grid-template-columns: 1fr
              - grid-template-rows: auto
              custom_fields:
                c:
                - justify-self: stretch
                - text-align: left
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            template: info_tile
            entity: sensor.kidsnote_summary
            name: 보관함
            icon: mdi:folder-image
            show_state: true
            state_display: '[[[ return ''사진 · 영상 전체''; ]]]'
            variables:
              on_states: []
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser
          - type: custom:button-card
            template: info_tile
            entity: sensor.kidsnote_summary
            name: 수집 상태
            icon: mdi:cloud-sync-outline
            variables:
              on_states:
              - running
            state_display: |
              [[[
                const m = {ok: '정상', running: '불러오는 중', error: '오류', never: '수집 전'};
                return m[entity.state] || '연결 없음';
              ]]]
      - type: custom:button-card
        template: spacer_bottom
